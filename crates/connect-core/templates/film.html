<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}};--warm:color-mix(in srgb,var(--accent) 40%,#ff8a5b);--rose:color-mix(in srgb,var(--accent) 45%,#ff6f91);--bg:#191210;--ink:#f6ebe1;--muted:rgba(246,235,225,.62);--film:#0d0a09;--en:"Didot","Bodoni 72",Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{position:relative;margin:0;overflow-x:hidden;color:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;background:radial-gradient(90% 520px at 50% 0%,color-mix(in srgb,var(--warm) 45%,transparent),transparent 70%),var(--bg)}
/* 胶片颗粒 */
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:radial-gradient(rgba(255,255,255,.5) .6px,transparent .8px),radial-gradient(rgba(0,0,0,.6) .6px,transparent .8px);background-size:3px 3px,5px 5px;background-position:0 0,1px 2px;mix-blend-mode:overlay}
section{position:relative;padding:48px 22px}
.wrap{max-width:600px;margin:0 auto}
.en{font-family:var(--en);letter-spacing:.3em}
/* 封面：大号「在一起 N 天」 */
.cover{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.cover:before{content:"";position:absolute;inset:-30px;background:var(--cover) var(--cover-pos,center)/cover no-repeat;filter:blur(18px) saturate(1.1);opacity:.32;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.no-cover .cover:before{display:none}
.cover>*{position:relative}
.story{font-size:12px;color:var(--warm)}
h1{margin:18px 0 26px;font-size:clamp(28px,8vw,42px);font-weight:500;letter-spacing:.12em;line-height:1.4}
.counter .cd-label{display:block;font-size:14px;letter-spacing:.4em;color:var(--muted)}
.counter .cd-num{display:block;margin:8px 0 2px;font:400 clamp(72px,26vw,140px)/1 var(--en);background:linear-gradient(180deg,#fff,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.counter .cd-unit{font-size:15px;letter-spacing:.5em;color:var(--muted)}
.counter[hidden]{display:none}
.heart{width:20px;height:20px;margin:30px auto 4px;background:var(--rose);transform:rotate(-45deg);animation:beat 1.4s ease-in-out infinite;filter:drop-shadow(0 0 12px var(--rose))}
.heart:before,.heart:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:inherit}
.heart:before{top:-10px;left:0}.heart:after{top:0;left:10px}
@keyframes beat{0%,100%{transform:rotate(-45deg) scale(1)}15%{transform:rotate(-45deg) scale(1.25)}30%{transform:rotate(-45deg) scale(1)}45%{transform:rotate(-45deg) scale(1.15)}}
.since{margin-top:26px;font-size:14px;letter-spacing:.2em;color:var(--muted)}
.since b{font-family:var(--en);font-weight:400;color:var(--ink);margin-left:8px}
.since:has(b:empty){display:none}
.names{margin-top:10px;font-size:16px;letter-spacing:.3em}
/* 胶片条 */
.strip{position:relative;margin:0 -22px;padding:26px 0;background:var(--film);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.strip:before,.strip:after{content:"";position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(246,235,225,.85) 8px 20px,transparent 20px 28px);-webkit-mask:linear-gradient(#000 0 0);border-radius:2px;opacity:.9}
.strip:before{top:7px}.strip:after{bottom:7px}
.frames{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 22px;counter-reset:f;scrollbar-width:none}
.frames::-webkit-scrollbar{display:none}
.frames img{flex:0 0 auto;height:min(58vw,260px);width:auto;max-width:86vw;object-fit:cover;scroll-snap-align:center;filter:sepia(.18) saturate(1.05) contrast(1.02);border-radius:3px}
.frames:empty{display:none}
.strip:has(.frames:empty),.strip:has(.frames:empty)+.hint{display:none}
.hint{margin-top:10px;text-align:center;font-size:11px;letter-spacing:.3em;color:var(--muted)}
/* 情书 */
.letter{text-align:center}
.letter .open{font-size:18px;color:var(--warm)}
.letter p{margin:0 0 16px;font-size:16px;line-height:2.15}
.letter .close{margin-top:24px;font-size:18px;color:var(--rose)}
.letter p:empty{display:none}
.line{width:1px;height:46px;margin:0 auto 26px;background:linear-gradient(transparent,var(--warm))}
.end{text-align:center;padding-bottom:90px}
.end .cn{font-size:22px;letter-spacing:.5em}
.end .en{margin-top:10px;font-size:11px;color:var(--muted)}
.js [data-reveal]{opacity:0;transform:translateY(24px);filter:blur(4px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1.1s ease}
.js [data-reveal].in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){.heart{animation:none}.js [data-reveal]{opacity:1;transform:none;filter:none;transition:none}}
{{custom_css}}
</style>
</head>
<body class="{{cover_class}}" style="--cover:{{cover_bg}}">
<section class="cover">
  <div class="story en" data-reveal>OUR STORY</div>
  <h1 data-reveal>{{title}}</h1>
  <div class="counter" data-reveal data-countdown="{{date}}" data-before="距离纪念日还有" data-today="就是今天" data-after="我们已经在一起" hidden><span class="cd-label"></span><span class="cd-num"></span><span class="cd-unit">天</span></div>
  <div class="heart" aria-hidden="true"></div>
  <div class="since" data-reveal>纪念日<b>{{date_dot}}</b></div>
  <div class="names" data-reveal>{{recipient}}</div>
</section>
<section><div class="wrap">
  <div class="strip" data-reveal><div class="frames">{{photos}}</div></div>
  <div class="hint">← 左右滑动 →</div>
</div></section>
<section class="letter"><div class="wrap" data-reveal>
  <div class="line"></div>
  <p class="open">{{opening}}</p>
  {{body}}
  <p class="close">{{closing}}</p>
  {{media}}
</div></section>
<section class="end" data-reveal><div class="cn">未完待续</div><div class="en">TO BE CONTINUED</div></section>
<script>{{template_js}}</script>
</body>
</html>
