<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}};--gold:#c8a46a;--gold-2:#e9d3a6;--ivory:#f8f5ef;--ink:#1d1b18;--muted:#7d766c;--serif-en:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:"Songti SC","Noto Serif SC","STSong",serif}
.en{font-family:var(--serif-en)}
/* 封面：整屏照片 + 刊头 + 大号日期 */
.cover{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;color:#fff;background:var(--cover) var(--cover-pos,center)/cover no-repeat,radial-gradient(90% 60% at 70% 20%,#4a3f31,#16130f 70%)}
.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,.75))}
.no-cover .cover:after{content:"";position:absolute;right:-80px;top:12%;width:320px;height:320px;border-radius:50%;border:1px solid rgba(200,164,106,.35);box-shadow:0 0 0 30px rgba(200,164,106,.06),0 0 0 31px rgba(200,164,106,.2)}
.mast{position:absolute;top:max(24px,env(safe-area-inset-top));left:24px;right:80px;display:flex;justify-content:space-between;align-items:baseline;z-index:1}
.mast .brand{font-size:24px;letter-spacing:.32em}
.mast .issue{font-size:9px;letter-spacing:.3em;opacity:.8;white-space:nowrap}
.vertical{position:absolute;right:22px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;letter-spacing:.5em;font-size:13px;opacity:.85;z-index:1}
.vertical:empty{display:none}
.hero{position:absolute;left:24px;right:24px;bottom:max(36px,env(safe-area-inset-bottom));z-index:1}
.hero .num{font-size:clamp(72px,24vw,150px);line-height:.9;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.2px var(--gold-2)}
.hero .num:empty{display:none}
.hero h1{margin:14px 0 6px;font-size:clamp(28px,8vw,46px);font-weight:500;line-height:1.3;letter-spacing:.06em}
.hero .names{font-size:14px;letter-spacing:.3em;color:var(--gold-2)}
.hero .rule{width:56px;height:1px;margin:16px 0 0;background:var(--gold)}
/* 正文：杂志排版 */
.page{max-width:680px;margin:0 auto;padding:64px 26px}
.kicker{display:flex;align-items:center;gap:12px;margin-bottom:22px;font-size:11px;letter-spacing:.36em;color:var(--gold)}
.kicker b{font-family:var(--serif-en);font-size:28px;font-weight:400;letter-spacing:0;color:var(--ink)}
.kicker:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.letter p{margin:0 0 16px;font-size:16px;line-height:2;text-align:justify}
.letter .opening{font-size:18px}
.letter .opening:first-letter{float:left;margin:6px 10px 0 0;font-size:3.2em;line-height:.9;color:var(--gold);font-family:var(--serif-en)}
.letter p:empty{display:none}
.letter .quote{position:relative;margin:40px 0 0;padding:26px 0 0;text-align:center;font-size:20px;line-height:1.8;font-style:italic;border-top:1px solid rgba(200,164,106,.5)}
.letter .quote:before{content:"\201C";position:absolute;top:-30px;left:50%;transform:translateX(-50%);padding:0 12px;background:var(--ivory);font-family:var(--serif-en);font-size:56px;line-height:1;color:var(--gold)}
.letter .quote:empty{display:none}
/* 日期卡 */
.date-card{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center;padding:26px;background:var(--ink);color:#fff}
.date-card .day{grid-row:span 2;font-family:var(--serif-en);font-size:64px;line-height:1;color:var(--gold-2)}
.date-card .ym{font-size:13px;letter-spacing:.3em;color:var(--gold)}
.date-card .wk{font-size:13px;letter-spacing:.3em;opacity:.8}
.date-card .countdown{grid-column:1/-1;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;letter-spacing:.2em;color:rgba(255,255,255,.75)}
.date-card .cd-num{margin:0 6px;font-family:var(--serif-en);font-size:24px;color:var(--gold-2)}
.countdown[hidden],.date-card:has(.day:empty){display:none}
/* 相册：首张通栏 */
.gallery{columns:2;column-gap:10px}
.gallery:empty{display:none}
.gallery:has(img:only-child){columns:1}
.gallery img{display:block;width:100%;height:auto;margin:0 0 10px;break-inside:avoid;filter:saturate(.92)}
.gallery:has(img:only-child) img{width:auto;max-width:100%;max-height:78vh;margin:0 auto}
.end{padding:20px 26px 90px;text-align:center}
.end .en{font-size:30px;letter-spacing:.2em}
.end .cn{margin-top:8px;font-size:11px;letter-spacing:.5em;color:var(--muted)}
.js [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.js [data-reveal].in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js [data-reveal]{opacity:1;transform:none;transition:none}}
{{custom_css}}
</style>
</head>
<body class="{{cover_class}}" style="--cover:{{cover_bg}}">
<header class="cover">
  <div class="mast"><span class="brand en">FOREVER</span><span class="issue en">SPECIAL ISSUE</span></div>
  <div class="vertical">{{date_cn}}</div>
  <div class="hero" data-reveal>
    <div class="num en">{{date_md}}</div>
    <h1>{{title}}</h1>
    <div class="names">{{recipient}}</div>
    <div class="rule"></div>
  </div>
</header>
<main class="page">
  <div class="kicker" data-reveal><b>01</b>THE LETTER</div>
  <article class="letter" data-reveal>
    <p class="opening">{{opening}}</p>
    {{body}}
    <p class="quote">{{closing}}</p>
  </article>
</main>
<section class="page" style="padding-top:0">
  <div class="kicker" data-reveal><b>02</b>THE DAY</div>
  <div class="date-card" data-reveal>
    <div class="day">{{day}}</div>
    <div class="ym en">{{year}} · {{month}}</div>
    <div class="wk">{{weekday}}</div>
    <div class="countdown" data-countdown="{{date}}" hidden><span class="cd-label"></span><span class="cd-num"></span><span class="cd-unit">天</span></div>
  </div>
</section>
<section class="page" style="padding-top:0">
  <div class="kicker" data-reveal><b>03</b>MOMENTS</div>
  <div class="gallery" data-reveal>{{photos_rest}}</div>
  {{media}}
</section>
<footer class="end" data-reveal><div class="en">FOREVER</div><div class="cn">谢 谢 你 来 到 我 的 生 命</div></footer>
<script>{{template_js}}</script>
</body>
</html>
