<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}}}
*{box-sizing:border-box}
body{margin:0;background:#e8e2d8;padding:40px 16px;font-family:"Songti SC","Noto Serif SC",Georgia,serif;color:#332d27}
.letter{max-width:760px;margin:0 auto;background:repeating-linear-gradient(#fffdf7,#fffdf7 31px,#e9e1d5 32px);padding:52px 56px;box-shadow:0 18px 50px rgba(60,45,30,.15);border-left:1px solid #d8cec0}
.date{color:var(--accent);font-size:13px;letter-spacing:.12em}
h1{font-size:32px;margin:20px 0 8px}
.to{margin-bottom:26px;color:#7d7267}
p{line-height:32px;font-size:15px;margin:0}
.photos{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}
.photos img{width:calc(50% - 6px);height:200px;object-fit:cover;border:6px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.sign{margin-top:38px;text-align:right;font-style:italic}
{{custom_css}}
</style>
</head>
<body>
<main class="letter">
  <div class="date">{{date}}</div>
  <h1>{{title}}</h1>
  <div class="to">亲爱的 {{recipient}}：</div>
  <p>{{opening}}</p>
  {{body}}
  <div class="photos">{{photos}}</div>
  <p>{{closing}}</p>
  <div class="sign">{{recipient}}</div>
</main>
</body>
</html>
