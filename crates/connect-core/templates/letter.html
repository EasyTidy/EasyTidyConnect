<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:42px 16px;background:radial-gradient(circle at 50% 0,#f7f0e4,#e4d8c6);font-family:"Songti SC","Noto Serif SC",Georgia,serif;color:#392f27}
.letter{position:relative;max-width:780px;margin:0 auto;background:#fffdf6;padding:58px 62px 62px;box-shadow:0 24px 70px rgba(70,50,30,.18);background-image:linear-gradient(transparent 31px,rgba(120,90,60,.08) 32px);background-size:100% 32px}
.letter:before{content:"";position:absolute;left:38px;top:0;bottom:0;width:1px;background:rgba(180,110,100,.28)}
.stamp{position:absolute;right:42px;top:30px;width:72px;height:88px;border:1px dashed #b9a68f;border-radius:3px;display:grid;place-items:center;color:#a58f77;font-size:10px;letter-spacing:.14em;transform:rotate(3deg)}
.date{color:var(--accent);font-size:12px;letter-spacing:.24em}
h1{font-size:34px;font-weight:500;margin:20px 0 6px}
.to{color:#8c7b68;margin-bottom:30px;font-size:14px}
p{font-size:15px;line-height:32px;margin:0;text-align:justify}
.photos{margin:28px 0}
.photos{columns:2;column-gap:14px}
.photos:empty{display:none}
.photos:has(img:only-child){columns:1}
.photos img{display:block;width:100%;height:auto;margin:0 0 14px;break-inside:avoid;padding:7px;background:#fff;border:1px solid #e5d8c6;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.photos:has(img:only-child) img{width:auto;max-width:100%;max-height:78vh;margin:0 auto}
.photos img:nth-child(odd){transform:rotate(-1deg)}
.photos img:nth-child(even){transform:rotate(1.2deg)}
.sign{margin-top:44px;text-align:right;font-size:17px;color:#5c4d3e;font-style:italic}
.sign:after{content:"";display:block;width:90px;height:1px;background:var(--accent);margin:12px 0 0 auto;opacity:.5}
{{custom_css}}
</style>
</head>
<body>
<main class="letter">
  <div class="stamp">WITH LOVE</div>
  <div class="date">{{date}}</div>
  <h1>{{title}}</h1>
  <div class="to">亲爱的 {{recipient}}：</div>
  <p>{{opening}}</p>
  {{body}}
  <div class="photos">{{photos}}</div>
  {{media}}
  <p>{{closing}}</p>
  <div class="sign">{{recipient}}</div>
</main>
</body>
</html>
