<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:54px 16px;background:#e9e1d4;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:6px 6px;font-family:"Kaiti SC","STKaiti","KaiTi",serif;color:#3a3128}
.board{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;align-items:start}
.note{position:relative;background:#fffdf8;padding:34px 28px 58px;box-shadow:0 16px 36px rgba(60,40,20,.18);transform:rotate(-1.6deg)}
.note:nth-child(2n){transform:rotate(1.8deg)}
.note:before{content:"";position:absolute;top:-12px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(214,190,160,.55);box-shadow:0 2px 4px rgba(0,0,0,.06)}
.pin{width:38px;height:38px;border-radius:50%;background:var(--accent);opacity:.85;margin:0 auto 18px;box-shadow:inset 0 -5px 10px rgba(0,0,0,.18),0 4px 8px rgba(0,0,0,.15)}
.date{display:block;text-align:center;color:#9a8b78;font-size:12px;letter-spacing:.24em}
h1{font-size:30px;font-weight:500;text-align:center;margin:14px 0 8px;line-height:1.35}
.to{text-align:center;color:#a0907d;font-size:13px;margin-bottom:22px}
p{font-size:16px;line-height:2;margin:0 0 14px}
.photos{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:24px 0}
.photos img{width:calc(50% - 12px);min-width:140px;height:210px;object-fit:cover;background:#eee;padding:10px 10px 34px;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.14);transform:rotate(-2deg)}
.photos img:nth-child(2n){transform:rotate(2.4deg)}
.sign{text-align:right;font-size:20px;color:var(--accent);margin-top:26px}
{{custom_css}}
</style>
</head>
<body>
<div class="board">
  <article class="note">
    <div class="pin"></div>
    <span class="date">{{date}}</span>
    <h1>{{title}}</h1>
    <div class="to">写给 {{recipient}}</div>
    <p>{{opening}}</p>
    {{body}}
    <div class="photos">{{photos}}</div>
    {{media}}
    <p>{{closing}}</p>
    <div class="sign">{{recipient}}</div>
  </article>
</div>
</body>
</html>
