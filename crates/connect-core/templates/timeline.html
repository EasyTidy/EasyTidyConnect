<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}}}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f8;color:#202534;font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:56px 18px}
.timeline{max-width:760px;margin:0 auto;position:relative;padding-left:34px}
.timeline:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:color-mix(in srgb,var(--accent) 35%,#fff)}
.item{position:relative;margin-bottom:34px;background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 10px 30px rgba(30,40,80,.07)}
.item:before{content:"";position:absolute;left:-33px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px #f3f4f8}
.date{font-size:12px;color:var(--accent);letter-spacing:.1em}
h1{font-size:30px;margin:6px 0 10px}
.to{color:#7b849a;font-size:13px;margin-bottom:14px}
p{line-height:1.9;font-size:14px;margin:0 0 12px;color:#3c4354}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.photos img{width:100%;height:190px;object-fit:cover;border-radius:8px}
.sign{text-align:right;color:#6c7487;font-style:italic;margin-top:18px}
{{custom_css}}
</style>
</head>
<body>
<main class="timeline">
  <section class="item">
    <div class="date">{{date}}</div>
    <h1>{{title}}</h1>
    <div class="to">TO {{recipient}}</div>
    <p>{{opening}}</p>
    {{body}}
    <div class="photos">{{photos}}</div>
    <p>{{closing}}</p>
    <div class="sign">{{recipient}}</div>
  </section>
</main>
</body>
</html>
