<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:56px 18px;background:linear-gradient(160deg,#eef2fb,#e4e9f5 45%,#f6f0e8);font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#26304a}
.timeline{max-width:800px;margin:0 auto;position:relative;padding-left:40px}
.timeline:before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--accent),transparent)}
.item{position:relative;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:30px 32px;box-shadow:0 22px 50px rgba(40,55,90,.10);backdrop-filter:blur(12px)}
.item:before{content:"";position:absolute;left:-36px;top:38px;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px #e9edf7}
.date{font-size:11px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
h1{font-size:34px;margin:10px 0 10px;font-weight:600;letter-spacing:-.02em}
.to{color:#7d88a1;font-size:13px;margin-bottom:22px}
p{font-size:15px;line-height:1.95;margin:0 0 14px;color:#3d4861}
.photos{display:flex;gap:10px;margin:24px -32px;padding:0 32px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.photos::-webkit-scrollbar{display:none}
.photos:empty{display:none}
.photos img{flex:0 0 auto;display:block;height:230px;width:auto;max-width:82%;object-fit:cover;border-radius:14px;scroll-snap-align:start;box-shadow:0 12px 26px -14px rgba(40,55,90,.5)}
.photos:has(img:only-child){margin:24px 0;padding:0}
.photos:has(img:only-child) img{height:auto;max-height:70vh;width:auto;max-width:100%;margin:0 auto}
.sign{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:26px;color:#6f7c99;font-size:14px}
.sign:before{content:"";width:36px;height:1px;background:var(--accent);opacity:.5}
{{custom_css}}
</style>
</head>
<body>
<main class="timeline">
  <section class="item">
    <div class="date">{{date}}</div>
    <h1>{{title}}</h1>
    <div class="to">TO {{recipient}}</div>
    <p>{{opening}}</p>
    {{body}}
    <div class="photos">{{photos}}</div>
    {{media}}
    <p>{{closing}}</p>
    <div class="sign">{{recipient}}</div>
  </section>
</main>
</body>
</html>
