<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:58px 16px;background:radial-gradient(circle at 50% 0,#26345c 0,#10162b 45%,#080b16 100%);color:#eef3ff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 70%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 65%,#fff 50%,transparent 51%);background-size:320px 260px,420px 360px,500px 420px,600px 500px;opacity:.55;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:320px 260px,-420px 360px,500px -420px,-600px 500px}}
.card{position:relative;max-width:780px;margin:0 auto;padding:56px 46px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(180,205,255,.22);box-shadow:0 30px 100px rgba(0,0,0,.45);backdrop-filter:blur(14px);text-align:center;overflow:hidden}
.card:before{content:"";position:absolute;inset:-40% -20%;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--accent) 40%,transparent),transparent 55%);opacity:.35;pointer-events:none}
.moon{width:54px;height:54px;border-radius:50%;margin:0 auto 20px;background:radial-gradient(circle at 35% 35%,#fffef2,#e8ddb8 55%,#bfae82);box-shadow:0 0 40px rgba(255,240,190,.45)}
.date{color:var(--accent);font-size:11px;letter-spacing:.38em;text-transform:uppercase}
h1{font-size:clamp(32px,6vw,54px);font-weight:300;letter-spacing:.05em;margin:18px 0 10px;text-shadow:0 0 30px rgba(160,190,255,.25)}
.to{color:#9fb2d8;font-size:13px;letter-spacing:.16em;margin-bottom:32px}
p{font-size:15px;line-height:2.05;color:#d9e3f8;margin:0 0 16px;text-align:justify}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:26px 0}
.photos img{width:100%;height:220px;object-fit:cover;border-radius:14px;opacity:.9;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.sign{margin-top:34px;display:flex;justify-content:center;align-items:center;gap:12px;color:#a9bce0;font-style:italic;letter-spacing:.08em}
.sign:before,.sign:after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.sign:after{transform:scaleX(-1)}
{{custom_css}}
</style>
</head>
<body>
<div class="stars"></div>
<main class="card">
  <div class="moon"></div>
  <div class="date">{{date}}</div>
  <h1>{{title}}</h1>
  <div class="to">献给 {{recipient}}</div>
  <p>{{opening}}</p>
  {{body}}
  <div class="photos">{{photos}}</div>
  {{media}}
  <p>{{closing}}</p>
  <div class="sign">{{recipient}}</div>
</main>
</body>
</html>
