<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}};--a2:#ff5fa2;--a3:#ffd23f;--ink:#15131a;--paper:#fffaf2;--muted:#6b6672;--sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;--disp:"Futura","Avenir Next","Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#fff3e6}
body{position:relative;margin:0;overflow-x:hidden;color:var(--ink);font-family:var(--sans);background:radial-gradient(60% 520px at 10% 0%,color-mix(in srgb,var(--a2) 55%,transparent),transparent 70%),radial-gradient(60% 520px at 95% 8%,color-mix(in srgb,var(--a3) 70%,transparent),transparent 70%),radial-gradient(70% 600px at 50% 100%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 70%),#fff3e6}
section{position:relative;padding:44px 22px}
.wrap{max-width:560px;margin:0 auto}
/* 彩带 */
.confetti{position:absolute;inset:0 0 auto;height:100vh;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-24px;left:var(--x);width:9px;height:15px;border-radius:2px;background:var(--c);opacity:.9;animation:fall var(--t,7s) linear var(--d,0s) infinite;transform:rotate(var(--r))}
.confetti i:nth-child(3n){width:10px;height:10px;border-radius:50%}
.confetti i:nth-child(4n){width:16px;height:5px}
@keyframes fall{0%{transform:translateY(0) rotate(var(--r))}100%{transform:translateY(105vh) rotate(calc(var(--r) + 540deg))}}
/* 封面 */
.cover{min-height:100vh;min-height:100svh;display:flex;align-items:center}
.cover .wrap{width:100%;display:flex;flex-direction:column;gap:22px}
.pill{align-self:flex-start;padding:7px 14px;border:2px solid var(--ink);border-radius:999px;background:#fff;font:700 12px/1 var(--disp);letter-spacing:.24em;box-shadow:3px 3px 0 var(--ink)}
h1{margin:0;font:900 clamp(44px,15vw,88px)/1.02 var(--disp);letter-spacing:-.01em;transform:rotate(-3deg);transform-origin:left center}
h1 span{background:linear-gradient(transparent 62%,var(--a3) 62%,var(--a3) 92%,transparent 92%)}
.host{margin-top:6px;font-size:16px;font-weight:600;color:var(--muted)}
.host:empty{display:none}
.sticker{position:relative;align-self:flex-end;width:min(46vw,190px);aspect-ratio:1;margin:0 4px -34px 0;border-radius:28px;border:6px solid #fff;background:var(--cover) var(--cover-pos,center)/cover no-repeat;box-shadow:0 16px 30px -12px rgba(0,0,0,.45);transform:rotate(8deg)}
.sticker:after{content:"";position:absolute;top:-14px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(255,210,63,.75);transform:rotate(-6deg)}
.no-cover .sticker{display:none}
/* 门票 */
.ticket{display:flex;max-width:420px;border:2px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.ticket .main{flex:1;padding:16px 18px}
.ticket .lab{font:700 11px/1 var(--disp);letter-spacing:.24em;color:var(--muted)}
.ticket .big{margin-top:8px;font:900 40px/1 var(--disp);color:var(--accent)}
.ticket .wk{margin-top:6px;font-size:13px;font-weight:600}
.ticket .stub{position:relative;width:74px;display:grid;place-items:center;background:var(--accent);color:#fff;border-left:2px dashed var(--ink)}
.ticket .stub:before,.ticket .stub:after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:#fff3e6;border:2px solid var(--ink)}
.ticket .stub:before{top:-12px}.ticket .stub:after{bottom:-12px}
.ticket .stub b{writing-mode:vertical-rl;font:800 13px/1 var(--disp);letter-spacing:.3em}
.ticket:has(.big:empty){display:none}
/* 详情卡 */
.card{padding:26px 22px;border:2px solid var(--ink);border-radius:22px;background:#fff;box-shadow:6px 6px 0 var(--ink)}
.card h2{margin:0 0 16px;font:900 24px/1.2 var(--disp)}
.card h2:after{content:"";display:block;width:44px;height:6px;margin-top:10px;border-radius:3px;background:var(--a2)}
.card p{margin:0 0 12px;font-size:16px;line-height:1.9}
.card .closing{margin-top:18px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--a3) 35%,#fff);font-weight:700}
.card p:empty{display:none}
/* 倒计时 */
.countdown{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:18px;border-radius:22px;background:var(--ink);color:#fff;font-weight:700}
.countdown .cd-num{font:900 46px/1 var(--disp);color:var(--a3)}
.countdown[hidden]{display:none}
/* 照片墙 */
.gallery{columns:2;column-gap:16px}
.gallery:empty{display:none}
.gallery:has(img:only-child){columns:1}
.gallery img{display:block;width:100%;height:auto;margin:0 0 16px;break-inside:avoid;border:6px solid #fff;border-radius:16px;box-shadow:0 10px 20px -10px rgba(0,0,0,.45);transform:rotate(-2.5deg)}
.gallery:has(img:only-child) img{width:auto;max-width:100%;max-height:78vh;margin:0 auto}
.gallery img:nth-child(even){transform:rotate(3deg)}
.end{text-align:center;padding-bottom:90px}
.end .see{font:900 clamp(34px,11vw,56px)/1 var(--disp);transform:rotate(-2deg)}
.end .see span{color:var(--accent)}
.js [data-reveal]{opacity:0;transform:translateY(24px) scale(.98);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1.2)}
.js [data-reveal].in{opacity:1;transform:none}
.js h1[data-reveal].in{transform:rotate(-3deg)}
.js .sticker[data-reveal].in{transform:rotate(8deg)}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.js [data-reveal]{opacity:1;transform:none;transition:none}.js h1[data-reveal]{transform:rotate(-3deg)}}
{{custom_css}}
</style>
</head>
<body class="{{cover_class}}" style="--cover:{{cover_bg}}">
<div class="confetti" aria-hidden="true">
  <i style="--x:6%;--c:var(--accent);--r:20deg;--d:-1s;--t:6.5s"></i><i style="--x:16%;--c:var(--a3);--r:-30deg;--d:-4s"></i><i style="--x:27%;--c:var(--a2);--r:60deg;--d:-2.5s;--t:8s"></i><i style="--x:38%;--c:#4dd6c1;--r:10deg;--d:-6s"></i><i style="--x:49%;--c:var(--accent);--r:-50deg;--d:-3.2s;--t:7.5s"></i><i style="--x:58%;--c:var(--a3);--r:35deg;--d:-0.5s"></i><i style="--x:67%;--c:#7c6cff;--r:-15deg;--d:-5s;--t:6s"></i><i style="--x:76%;--c:var(--a2);--r:75deg;--d:-2s"></i><i style="--x:85%;--c:#4dd6c1;--r:-40deg;--d:-4.6s;--t:8.5s"></i><i style="--x:93%;--c:var(--accent);--r:15deg;--d:-1.6s"></i><i style="--x:44%;--c:#7c6cff;--r:50deg;--d:-7s;--t:9s"></i><i style="--x:21%;--c:var(--accent);--r:-65deg;--d:-5.5s"></i>
</div>
<section class="cover"><div class="wrap">
  <div class="sticker" data-reveal></div>
  <div class="pill" data-reveal>YOU'RE INVITED</div>
  <h1 data-reveal><span>{{title}}</span></h1>
  <div class="host" data-reveal>{{recipient}}</div>
  <div class="ticket" data-reveal>
    <div class="main"><div class="lab">DATE · 日期</div><div class="big">{{date_md}}</div><div class="wk">{{year}} · {{weekday}}</div></div>
    <div class="stub"><b>ADMIT ONE</b></div>
  </div>
</div></section>
<section><div class="wrap">
  <article class="card" data-reveal>
    <h2>派对详情</h2>
    <p>{{opening}}</p>
    {{body}}
    <p class="closing">{{closing}}</p>
  </article>
</div></section>
<section><div class="wrap" data-reveal>
  <div class="countdown" data-countdown="{{date}}" data-before="距离派对还有" data-today="派对就是今天" data-after="派对已经过去" hidden><span class="cd-label"></span><span class="cd-num"></span><span class="cd-unit">天</span></div>
</div></section>
<section><div class="wrap"><div class="gallery" data-reveal>{{photos_rest}}</div>{{media}}</div></section>
<section class="end" data-reveal><div class="see">SEE YOU <span>THERE!</span></div></section>
<script>{{template_js}}</script>
</body>
</html>
