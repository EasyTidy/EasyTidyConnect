<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--accent:{{theme}}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5f1;color:#24201c;font-family:"Songti SC","Noto Serif SC",Georgia,serif}
.card{width:min(720px,92vw);padding:56px 48px;background:#fff;border-radius:2px;box-shadow:0 24px 80px rgba(40,32,24,.14);position:relative}
.card:before{content:"";position:absolute;inset:16px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);pointer-events:none}
.date{letter-spacing:.2em;color:var(--accent);font-size:12px;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,48px);margin:18px 0 6px;font-weight:600}
.to{color:#8a8178;font-size:14px;margin-bottom:30px}
p{line-height:2;font-size:16px;margin:0 0 16px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:28px 0}
.photos img{width:100%;height:220px;object-fit:cover;border-radius:4px;display:block}
.sign{margin-top:36px;text-align:right;color:#5c554d;font-style:italic}
{{custom_css}}
</style>
</head>
<body>
<main class="card">
  <div class="date">{{date}}</div>
  <h1>{{title}}</h1>
  <div class="to">写给 {{recipient}}</div>
  <p>{{opening}}</p>
  {{body}}
  <div class="photos">{{photos}}</div>
  <p>{{closing}}</p>
  <div class="sign">{{recipient}} 收</div>
</main>
</body>
</html>
