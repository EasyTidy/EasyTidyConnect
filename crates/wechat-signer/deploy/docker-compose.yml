# docker compose up -d
# 配置写在同目录的 wechat-signer.env（参考 wechat-signer.env.example）。
services:
  wechat-signer:
    image: ghcr.io/easytidy/wechat-signer:latest
    # 或者从源码构建：
    # build:
    #   context: ../../..
    #   dockerfile: crates/wechat-signer/Dockerfile
    restart: unless-stopped
    env_file: wechat-signer.env
    environment:
      # 容器内监听所有地址，由下面的端口映射限制为只对本机开放
      WECHAT_LISTEN: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
